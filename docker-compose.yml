name: bcm-links

services:

  bcm-links-web:
    container_name: bcm-links-web
    image: "ghcr.io/karakeep-app/karakeep:release"
    restart: "no"
    volumes:
      - ./storage/app:/data
    ports:
      - "${KARAKEEP_PORT:-3333}:3000"
    networks:
      - bcm-links-network
    env_file:
      - .env
    environment:
      MEILI_ADDR: http://bcm-links-search:7700
      BROWSER_WEB_URL: http://bcm-links-browser:9222
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      DISABLE_SIGNUPS: "${DISABLE_SIGNUPS}"
      DATA_DIR: /data

  bcm-links-browser:
    container_name: bcm-links-browser
    image: ghcr.io/karakeep-app/karakeep-chrome:release
    restart: "no"
    init: true
    networks:
      - bcm-links-network
    command:
      - --disable-gpu
      - --disable-dev-shm-usage
      - --hide-scrollbars
      - --disable-blink-features=AutomationControlled
      - --window-size=1440,900

  bcm-links-search:
    container_name: bcm-links-search
    image: getmeili/meilisearch:v1.41.0
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - ./storage/search:/meili_data

networks:

  bcm-links-network:
    name: bcm-links-network
