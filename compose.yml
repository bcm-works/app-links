name: bcm-links

#
# Shared config for local Docker Compose and Railway infrastructure use.
#

services:

  bcm-links-web:
    # Railway service: "bcm-links-web", public domain on container port 3000,
    # Railway volume mounted at /data.
    image: "ghcr.io/karakeep-app/karakeep:release"
    volumes:
      - data:/data
    ports:
      # Railway ignores this mapping; generate a public domain for port 3000.
      - "${KARAKEEP_PORT:-3333}:${PORT:-3000}"
    env_file:
      - .env
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      DATA_DIR: /data
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET}"
      NEXTAUTH_URL: "${NEXTAUTH_URL:-http://localhost:${KARAKEEP_PORT:-3333}}"
      # Overridable so Railway can point at private-network hostnames, e.g.
      # http://bcm-links-search.railway.internal:7700 (see docs/INFRA.md).
      MEILI_ADDR: "${MEILI_ADDR:-http://bcm-links-search:7700}"
      MEILI_MASTER_KEY: "${MEILI_MASTER_KEY}"
      BROWSER_WEB_URL: "${BROWSER_WEB_URL:-http://bcm-links-browser:9222}"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      # Single-user instance: signups are locked by default. The one admin
      # account is created via bin/create-user.sh, which briefly lifts this
      # to "false" for the bootstrap signup only. Never commit "false" here.
      # (Railway: set the same DISABLE_SIGNUPS variable per docs/INFRA.md.)
      DISABLE_SIGNUPS: "${DISABLE_SIGNUPS:-true}"

  bcm-links-browser:
    image: zenika/alpine-chrome:123
    init: true
    command:
      - --no-sandbox
      - --disable-gpu
      - --disable-dev-shm-usage
      - "--remote-debugging-address=::"
      - --remote-debugging-port=9222
      - --hide-scrollbars
      - --disable-blink-features=AutomationControlled
      - --window-size=1440,900

  bcm-links-search:
    # Railway service: "bcm-links-search". Railway volume mounted at
    # /meili_data. No public domain (private network only).
    image: getmeili/meilisearch:v1.41.0
    environment:
      MEILI_NO_ANALYTICS: "true"
      MEILI_ENV: production
      # Dual-stack bind: required so Karakeep can reach Meilisearch over
      # Railway private networking (IPv6); also fine for local Docker.
      MEILI_HTTP_ADDR: "[::]:7700"
      MEILI_MASTER_KEY: "${MEILI_MASTER_KEY}"
    volumes:
      - meilisearch:/meili_data

volumes:

  data:
  meilisearch:
