#
# Docker Compose - Shared config for local and Railway infrastructure use.
#

name: bcm-links

services:

  bcm-links-web:
    image: "ghcr.io/karakeep-app/karakeep:release"
    volumes:
      - data:/data
    ports:
      - "${KARAKEEP_PORT:-3333}:${PORT:-3000}"
    env_file:
      - .env
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      DATA_DIR: /data
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET}"
      NEXTAUTH_URL: "${NEXTAUTH_URL:-http://localhost:${KARAKEEP_PORT:-3333}}"
      MEILI_ADDR: "${MEILI_ADDR:-http://bcm-links-search:7700}"
      MEILI_MASTER_KEY: "${MEILI_MASTER_KEY}"
      BROWSER_WEB_URL: "${BROWSER_WEB_URL:-http://bcm-links-browser:9222}"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      DISABLE_SIGNUPS: "${DISABLE_SIGNUPS:-true}"

  bcm-links-browser:
    image: zenika/alpine-chrome:123
    init: true
    command:
      - --no-sandbox
      - --disable-gpu
      - --disable-dev-shm-usage
      - "--remote-debugging-address=::"
      - --remote-debugging-port=9222
      - --hide-scrollbars
      - --disable-blink-features=AutomationControlled
      - --window-size=1440,900

  bcm-links-search:
    image: getmeili/meilisearch:v1.41.0
    environment:
      MEILI_NO_ANALYTICS: "true"
      MEILI_ENV: production
      MEILI_HTTP_ADDR: "[::]:7700"
      MEILI_MASTER_KEY: "${MEILI_MASTER_KEY}"
    volumes:
      - meilisearch:/meili_data

volumes:

  data:
  meilisearch:
